<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Sorteio 1000</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
  <header class="admin-head">
    <div>
      <h1>PAINEL <span>ADMIN</span></h1>
      <p id="contador">{{ reservas|length }} reserva(s) registrada(s)</p>
    </div>
    <div class="admin-actions">
      <a class="btn-export" href="{{ url_for('admin_exportar_excel') }}">Exportar Excel</a>
      <button id="btnZerar" class="btn-danger">Zerar todos os números</button>
      <a class="logout" href="{{ url_for('admin_logout') }}">Sair</a>
    </div>
  </header>

  <section class="card">
    <input id="busca" class="search" placeholder="Pesquisar por número, nome ou telefone...">
    <div class="table-wrap">
      <table id="tabela">
        <thead><tr><th>#</th><th>Número</th><th>Nome</th><th>WhatsApp</th><th>Data/hora</th><th>Ações</th></tr></thead>
        <tbody>
        {% for r in reservas %}
          <tr data-id="{{ r.id }}">
            <td>{{ r.id }}</td>
            <td class="col-numero"><strong>{{ "%04d"|format(r.numero) }}</strong></td>
            <td class="col-nome">{{ r.nome }}</td>
            <td class="col-telefone">{{ r.telefone }}</td>
            <td>{{ r.data_hora }}</td>
            <td class="col-acoes">
              <button class="btn-edit" data-id="{{ r.id }}" data-numero="{{ "%04d"|format(r.numero) }}" data-nome="{{ r.nome }}" data-telefone="{{ r.telefone }}">Editar</button>
              <button class="btn-delete" data-id="{{ r.id }}">Excluir</button>
            </td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </section>
</div>

<div id="modalEdit" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h2>Editar reserva</h2>
    <label>Número
      <input id="editNumero" type="text" maxlength="4">
    </label>
    <label>Nome
      <input id="editNome" type="text">
    </label>
    <label>WhatsApp
      <input id="editTelefone" type="text">
    </label>
    <p id="editErro" class="modal-erro"></p>
    <div class="modal-btns">
      <button id="btnCancelar" class="btn-secondary">Cancelar</button>
      <button id="btnSalvar">Salvar</button>
    </div>
  </div>
</div>

<script>
const busca = document.getElementById("busca");
busca.addEventListener("input", () => {
  const q = busca.value.toLowerCase();
  document.querySelectorAll("#tabela tbody tr").forEach(tr => {
    tr.style.display = tr.innerText.toLowerCase().includes(q) ? "" : "none";
  });
});

function atualizarContador() {
  const total = document.querySelectorAll("#tabela tbody tr").length;
  document.getElementById("contador").textContent = total + " reserva(s) registrada(s)";
}

document.querySelectorAll(".btn-delete").forEach(btn => {
  btn.addEventListener("click", async () => {
    const id = btn.dataset.id;
    if (!confirm("Tem certeza que deseja excluir esta reserva? Essa ação não pode ser desfeita.")) return;
    try {
      const resp = await fetch(`/admin/reservas/${id}/excluir`, { method: "POST" });
      const data = await resp.json();
      if (!resp.ok) {
        alert(data.erro || "Erro ao excluir.");
        return;
      }
      document.querySelector(`tr[data-id="${id}"]`).remove();
      atualizarContador();
    } catch (e) {
      alert("Erro de conexão ao excluir.");
    }
  });
});

let editandoId = null;
const modal = document.getElementById("modalEdit");
const editNumero = document.getElementById("editNumero");
const editNome = document.getElementById("editNome");
const editTelefone = document.getElementById("editTelefone");
const editErro = document.getElementById("editErro");

document.querySelectorAll(".btn-edit").forEach(btn => {
  btn.addEventListener("click", () => {
    editandoId = btn.dataset.id;
    editNumero.value = btn.dataset.numero;
    editNome.value = btn.dataset.nome;
    editTelefone.value = btn.dataset.telefone;
    editErro.textContent = "";
    modal.style.display = "flex";
  });
});

document.getElementById("btnCancelar").addEventListener("click", () => {
  modal.style.display = "none";
  editandoId = null;
});

document.getElementById("btnSalvar").addEventListener("click", async () => {
  editErro.textContent = "";
  try {
    const resp = await fetch(`/admin/reservas/${editandoId}/editar`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        numero: editNumero.value,
        nome: editNome.value,
        telefone: editTelefone.value
      })
    });
    const data = await resp.json();
    if (!resp.ok) {
      editErro.textContent = data.erro || "Erro ao salvar.";
      return;
    }
    const tr = document.querySelector(`tr[data-id="${editandoId}"]`);
    tr.querySelector(".col-numero").innerHTML = `<strong>${String(editNumero.value).padStart(4, "0")}</strong>`;
    tr.querySelector(".col-nome").textContent = editNome.value;
    tr.querySelector(".col-telefone").textContent = editTelefone.value;
    const editBtn = tr.querySelector(".btn-edit");
    editBtn.dataset.numero = String(editNumero.value).padStart(4, "0");
    editBtn.dataset.nome = editNome.value;
    editBtn.dataset.telefone = editTelefone.value;
    modal.style.display = "none";
    editandoId = null;
  } catch (e) {
    editErro.textContent = "Erro de conexão ao salvar.";
  }
});

document.getElementById("btnZerar").addEventListener("click", async () => {
  if (!confirm("Isso vai APAGAR TODAS as reservas e liberar todos os números. Tem certeza?")) return;
  if (!confirm("Confirme novamente: essa ação é irreversível. Continuar?")) return;
  try {
    const resp = await fetch("/admin/reservas/zerar", { method: "POST" });
    const data = await resp.json();
    if (!resp.ok) {
      alert(data.erro || "Erro ao zerar.");
      return;
    }
    document.querySelectorAll("#tabela tbody tr").forEach(tr => tr.remove());
    atualizarContador();
  } catch (e) {
    alert("Erro de conexão ao zerar.");
  }
});
</script>
</body>
</html>
