<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Sorteio 1000</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
  <header class="admin-head">
    <div>
      <h1>PAINEL <span>ADMIN</span></h1>
      <p>{{ reservas|length }} reserva(s) registrada(s)</p>
    </div>
    <a class="logout" href="{{ url_for('admin_logout') }}">Sair</a>
  </header>

  <section class="card">
    <input id="busca" class="search" placeholder="Pesquisar por número, nome ou telefone...">
    <div class="table-wrap">
      <table id="tabela">
        <thead><tr><th>#</th><th>Número</th><th>Nome</th><th>WhatsApp</th><th>Data/hora</th></tr></thead>
        <tbody>
        {% for r in reservas %}
          <tr>
            <td>{{ r.id }}</td>
            <td><strong>{{ "%04d"|format(r.numero) }}</strong></td>
            <td>{{ r.nome }}</td>
            <td>{{ r.telefone }}</td>
            <td>{{ r.data_hora }}</td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </section>
</div>
<script>
const busca = document.getElementById("busca");
busca.addEventListener("input", () => {
  const q = busca.value.toLowerCase();
  document.querySelectorAll("#tabela tbody tr").forEach(tr => {
    tr.style.display = tr.innerText.toLowerCase().includes(q) ? "" : "none";
  });
});
</script>
</body>
</html>
