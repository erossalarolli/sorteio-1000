<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio 1000</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
  <header>
    <h1>SORTEIO <span>1000</span></h1>
    <p>Escolha seu número de 0001 a 1000</p>
  </header>

  <div class="premio-banner">☕ Premiação: Cafeteira</div>

  <section class="card sorteio-card">
    <button id="btnSortear" class="btn-sortear">🎲 Sortear número vencedor</button>
    <div id="resultadoSorteio" class="resultado-sorteio" style="display:none"></div>
  </section>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="messages">
        {% for msg in messages %}<div class="message">{{ msg }}</div>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <section class="card form-card">
    <h2>Reservar número</h2>
    <form method="post" action="{{ url_for('reservar') }}">
      <label>Nome
        <input name="nome" required minlength="2" maxlength="100" placeholder="Seu nome">
      </label>
      <label>WhatsApp / telefone
        <input name="telefone" required inputmode="numeric" maxlength="15" placeholder="(65) 99999-9999">
      </label>
      <input type="hidden" name="numero" id="numero">
      <div class="chosen">Número escolhido: <strong id="chosen">nenhum</strong></div>
      <button type="submit" id="submit" disabled>Escolha um número</button>
    </form>
  </section>

  <section class="card">
    <div class="legend">
      <span><i class="available"></i> Disponível</span>
      <span><i class="occupied"></i> Reservado</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const ocupados = new Set({{ ocupados|list|tojson }});
const grid = document.getElementById("grid");
const numeroInput = document.getElementById("numero");
const chosen = document.getElementById("chosen");
const submit = document.getElementById("submit");

for (let n = 1; n <= 1000; n++) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "number " + (ocupados.has(n) ? "occupied" : "available");
  b.textContent = String(n).padStart(4, "0");

  if (ocupados.has(n)) {
    b.disabled = true;
    b.title = "Já reservado";
  } else {
    b.onclick = () => {
      document.querySelectorAll(".number.selected").forEach(x => x.classList.remove("selected"));
      b.classList.add("selected");
      numeroInput.value = n;
      chosen.textContent = String(n).padStart(4, "0");
      submit.disabled = false;
      submit.textContent = "Reservar " + String(n).padStart(4, "0");
      window.scrollTo({top: 0, behavior: "smooth"});
    };
  }
  grid.appendChild(b);
}

const btnSortear = document.getElementById("btnSortear");
const resultadoSorteio = document.getElementById("resultadoSorteio");

btnSortear.addEventListener("click", async () => {
  if (!confirm("Realizar o sorteio agora entre os números reservados?")) return;
  btnSortear.disabled = true;
  btnSortear.textContent = "Sorteando...";
  try {
    const resp = await fetch("/sortear", { method: "POST" });
    const data = await resp.json();
    if (!resp.ok) {
      alert(data.erro || "Não foi possível sortear.");
      return;
    }
    resultadoSorteio.innerHTML = `
      🏆 Número sorteado: <strong>${data.numero}</strong><br>
      Ganhador(a): <strong>${data.nome}</strong> — ${data.telefone}
    `;
    resultadoSorteio.style.display = "block";
    resultadoSorteio.scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (e) {
    alert("Erro de conexão ao sortear.");
  } finally {
    btnSortear.disabled = false;
    btnSortear.textContent = "🎲 Sortear número vencedor";
  }
});
</script>
</body>
</html>
